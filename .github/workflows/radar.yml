name: Radar de Ofertas

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia às 07:00 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]        # roda também quando o código muda

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: true   # uma rodada nova substitui a anterior (os dados já coletados são salvos)

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recuperar dados das rodadas anteriores
        run: |
          if git fetch --depth 1 origin dados 2>/dev/null; then
            git show FETCH_HEAD:radar.db.gz > radar.db.gz 2>/dev/null && gunzip -f radar.db.gz || rm -f radar.db.gz
            git show FETCH_HEAD:telegram_chat_id.txt > telegram_chat_id.txt 2>/dev/null || rm -f telegram_chat_id.txt
            echo "Banco recuperado: $(ls -lh radar.db 2>/dev/null | awk '{print $5}')"
          else
            echo "Primeira rodada: começando do zero."
          fi

      - name: Configurar
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          PUBLICWWW_API_KEY: ${{ secrets.PUBLICWWW_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_MAX_MINUTES: ${{ vars.RADAR_MAX_MINUTES }}
        run: |
          python radar.py init
          python ci/make_config.py

      - name: Ofertas nascendo (Certstream, 10 min)
        continue-on-error: true
        run: timeout 10m python radar.py certstream || true

      - name: Rodada completa
        id: run
        timeout-minutes: 55
        run: python radar.py run

      - name: Gerar ranking com o que foi processado
        if: always() && steps.run.outcome != 'success'
        run: |
          [ -f radar.db ] && python radar.py ranking || true

      - name: Enviar no Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_STATUS: ${{ steps.run.outcome }}
        run: python ci/notify.py

      - name: Salvar dados (branch "dados")
        if: always()
        run: |
          [ -f radar.db ] || { echo "sem banco para salvar"; exit 0; }
          D=$(mktemp -d)
          gzip -c radar.db > "$D/radar.db.gz"
          cp -r saida "$D/" 2>/dev/null || true
          cp telegram_chat_id.txt "$D/" 2>/dev/null || true
          printf '# Resultados do Radar\n\nÚltima rodada: %s\n\n- [Ranking de ofertas](saida/ranking_ofertas.csv)\n- [Ranking de domínios](saida/ranking_dominios.csv)\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" > "$D/README.md"
          cd "$D"
          git init -q -b dados
          git add -A
          git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" commit -qm "Rodada $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
          echo "Dados salvos."
